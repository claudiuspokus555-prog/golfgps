<style>

    font-size:17px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body{ background:var(--bg); }
  button{ -webkit-user-select:none; user-select:none; touch-action:manipulation; font-family:inherit; }
  body{ margin:0; color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:1rem; }

  .holebar{ display:flex; align-items:center; gap:8px; }
  .navbtn{ background:var(--bg); border:2px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; font-weight:900; font-size:1.1rem; }

  .navbtn[disabled]{ opacity:.3; pointer-events:none; }
  .holebadge{ flex:1; background:var(--accent); color:var(--accent-text); border-radius:12px; padding:8px 10px; text-align:center; }
  .holebadge .prog{ font-weight:900; font-size:1.5rem; line-height:1; }
  .holebadge .sub{ font-size:.85rem; font-weight:800; margin-top:2px; }

  .teerow{ display:flex; gap:8px; flex-wrap:wrap; }
  .teebtn{ flex:1; border-radius:10px; padding:9px 4px; text-align:center; font-weight:900; font-size:.95rem; border:2px solid var(--border); }
  .teebtn.blanc{ background:#FFFFFF; color:#000; }
  .teebtn.rouge{ background:#F4E3E3; color:#7A1414; }
  .teebtn.bleu{ background:#D6E8FA; color:#0B3D75; }
  .teebtn.sel{ border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }

  .card{ background:var(--surface); border:1.75px solid var(--border); border-radius:13px; padding:12px; display:flex; flex-direction:column; gap:9px; }

  .distbox{ display:flex; align-items:baseline; justify-content:center; gap:6px; }
  .distbox .dlabel{ font-size:.78rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
  .distbox .dnum{ font-size:1.4rem; font-weight:900; color:var(--danger); line-height:1; }
  .distbox .dunit{ font-size:.8rem; font-weight:800; color:var(--danger); margin-left:2px; }
  .dfeet{ font-size:.85rem; font-weight:800; color:var(--text-muted); }

  .clubline{ display:flex; align-items:center; gap:8px; font-size:1.02rem; font-weight:800; }
  .clubline b{ color:var(--accent); font-size:1.15rem; }
  .linklike{ background:none; border:none; color:var(--text-muted); font-size:.8rem; font-weight:700; text-decoration:underline; padding:5px; margin-left:auto; }

  .clubgrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .spotgrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
  .clubbtn{ background:var(--bg); border:1.75px solid var(--border); border-radius:9px; padding:10px 2px; min-height:2.6rem; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:800; font-size:.92rem; color:var(--text); }
  .clubbtn.sel{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

  .shotbtn{ display:block; width:100%; white-space:nowrap; text-align:center; font-size:1.05rem; font-weight:900; padding:13px 4px; border-radius:14px; border:none; background:var(--danger); color:#fff; }
  .shotbtn:active{ filter:brightness(.9); }
  .shotbtn[disabled]{ opacity:.4; pointer-events:none; }

  .keydisplay{ text-align:center; font-size:1.9rem; font-weight:900; color:var(--text); background:var(--bg); border:2px solid var(--accent); border-radius:12px; padding:5px; min-height:1.3em; display:flex; align-items:center; justify-content:center; }
  .clearbtn{ background:var(--bg); border:1.75px solid var(--border); border-radius:12px; color:var(--text-muted); font-weight:800; font-size:.85rem; }
  .clearbtn:active{ background:var(--border); }
  .keypad{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
  .keybtn{ background:var(--bg); border:1.75px solid var(--border); border-radius:9px; padding:11px 1px; font-size:1.05rem; font-weight:900; color:var(--text); }
  .keybtn:active{ background:var(--border); }
  .keybtn.wide{ grid-column:span 1; }
  .greenbtn{ width:100%; white-space:nowrap; background:none; border:2px dashed var(--accent); color:var(--accent); border-radius:10px; padding:10px 2px; font-weight:800; font-size:.95rem; }
  .greenbtn:active{ background:var(--accent); color:var(--accent-text); }
  .greenbtn[disabled]{ opacity:.35; pointer-events:none; }

  .greenbtn.bigtop{ background:#F2B705; color:#1A1A1A; border:3px solid #FFD84D; font-size:1.45rem; font-weight:900; padding:16px 4px; margin:4px 0 10px; box-shadow:0 3px 10px rgba(0,0,0,.35); }
  .friseq{ width:100%; margin:-4px 0 10px; background:#E3F2D1; border:2px solid var(--accent); border-radius:10px; padding:12px 4px; font-weight:900; font-size:1.05rem; color:var(--accent); }
  .greenbtn.bigtop:active{ background:#FFD84D; color:#1A1A1A; }
  .okbtn{ width:100%; background:var(--accent); color:var(--accent-text); border:none; border-radius:12px; padding:13px; font-weight:900; font-size:1.1rem; }

  @keyframes finishPulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(255,200,0,.0); filter:brightness(1); }

  }

  .puttbox.active{ border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }

  .scorebox .scorelabel{ font-size:.78rem; font-weight:800; color:var(--text-muted); white-space:nowrap; }
  input.scoreinput{ width:52px; flex:none; text-align:center; font-size:1.35rem; font-weight:900; color:var(--accent); padding:4px; border-radius:9px; border:2px solid var(--accent); background:var(--bg); }

  .sc-cell{ border-radius:8px; overflow:hidden; text-align:center; }

  .sc-body{ background:var(--bg); border:1.5px solid var(--border); border-top:none; padding:6px 1px; }

// [2026-10-03] Départs : bleu, blanc, rouge (les terrains n'ont pas tous le bleu)
var TEE_LABELS = {bleu:"Bleu", blanc:"Blanc", rouge:"Rouge"};
function teeLabelOf(t){ return TEE_LABELS[t] || "Blanc"; }
function teesText(c){ var l = teesOfCourse(c).map(function(x){ return teeLabelOf(x); }); return l.length>1 ? l.slice(0,-1).join(", ")+" ou "+l[l.length-1] : l.join(""); }
function teesOfCourse(c){ var co = COURSES[c]; return co ? ['bleu','blanc','rouge'].filter(function(x){ return !!co.tees[x]; }) : ['blanc','rouge']; }
var DEFAULT_COURSE = "Golf Cacouna";
var CLUBS=["Cobra1","Hybride 3","Bois 5","Fer 5","Fer 7","Fer 8","Fer 9","PW","SW","SW56"];
var CLUB_SHORT={"Hybride 3":"Hybr 3"};
function clubLabel(c){ return CLUB_SHORT[c] || c; }
function clubsForHole(hd){
  var lastShot = hd.shots[hd.shots.length-1];
  if(lastShot && lastShot.spot === "Frise du vert"){
    return ["Putter"].concat(CLUBS.filter(function(c){ return c!=="Cobra1" && c!=="Bois 5"; }));
  }
  return CLUBS;
}
var STORE_KEY="golfgpsplus_state_v1";
var GPS_PINS_KEY="golfgpsplus_pins_v1";

function teeDist(n,tee){
  var course = COURSES[ROUND.course] || COURSES[DEFAULT_COURSE];
  var arr = (course.tees[tee] || course.tees.blanc || []);
  return arr[n-1] || 0;
}
function parFor(n){
  var course = COURSES[ROUND.course] || COURSES[DEFAULT_COURSE];
  return (course.pars || [])[n-1] || 4;
}

// ---------------- GPS helpers ----------------
function haversineMeters(a,b){
  var R=6371000;
  var toRad=function(x){ return x*Math.PI/180; };
  var dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  var lat1=toRad(a.lat), lat2=toRad(b.lat);
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2*Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}
function haversineVerges(a,b){ return haversineMeters(a,b) / 0.9144; }

function loadPins(){
  try{ var raw=localStorage.getItem(GPS_PINS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function savePinGPS(course, holeNum, fix, source){
  try{
    var pins = loadPins();
    if(!pins[course]) pins[course] = {};
    pins[course][holeNum] = { lat:fix.lat, lon:fix.lon, accuracy:fix.accuracy||null, source:source||"gps-capture", savedAt:new Date().toISOString() };
    localStorage.setItem(GPS_PINS_KEY, JSON.stringify(pins));
  }catch(e){}
}
function getPinGPS(course, holeNum){
  var pins = loadPins();
  return (pins[course] && pins[course][holeNum]) || null;
}

var GPS = { lastFix:null, watching:false, error:null, watchId:null, safetyTimer:null };
var GPS_GOOD_ACCURACY_M = 20;   // GPS sur demande : position assez précise -> on coupe le GPS tout de suite
var GPS_MAX_AWAKE_MS = 45000;   // GPS sur demande : jamais plus de 45 s allumé d'affilée
var GPS_MAX_FIX_AGE_MS = 15000;   // une position plus vieille que ça est périmée (ex. celle du départ, gardée en cache par le téléphone)
var GPS_MAX_SUGGEST_ACC_M = 35;   // en dessous de cette précision seulement, on propose une distance
function onGeoSuccess(pos){
  // [fix 2026-10-01] Trou 7 : le téléphone a redonné la position du DÉPART (cache) -> « frappe de 5 v, reste 391 v ».
  // On jette toute position périmée.
  if(pos.timestamp && (Date.now() - pos.timestamp) > GPS_MAX_FIX_AGE_MS) return;
  var fix = { lat:pos.coords.latitude, lon:pos.coords.longitude, accuracy:pos.coords.accuracy };
  // en mode sur demande, garder la meilleure position reçue pendant le réveil
  if(!(isGpsOnDemand() && GPS.lastFix && GPS.lastFix.accuracy!=null && fix.accuracy!=null && fix.accuracy > GPS.lastFix.accuracy)) GPS.lastFix = fix;
  GPS.error = null;
  if(UI.pinAfterFix){ UI.pinAfterFix = false; savePinGPS(ROUND.course, ROUND.cur, GPS.lastFix, "gps-capture"); gpsNap(); render(); return; }
  var hd = getHole(ROUND.cur);
  if(hd.shots.length===0 && !hd.teeGPS){ hd.teeGPS = GPS.lastFix; saveRound(); }
  if(GPS.lastFix.accuracy==null || GPS.lastFix.accuracy <= GPS_MAX_SUGGEST_ACC_M) updateSuggestion();
  // Distance obtenue : on éteint le GPS immédiatement (la distance affichée reste)
  if(isGpsOnDemand() && GPS.lastFix.accuracy!=null && GPS.lastFix.accuracy <= GPS_GOOD_ACCURACY_M){ gpsSleepKeepFix(); render(); }
}
// Coupe le GPS sans oublier la position qu'on vient de lire (sert à la distance affichée).
function gpsSleepKeepFix(){
  if(GPS.safetyTimer){ clearTimeout(GPS.safetyTimer); GPS.safetyTimer = null; }
  if(GPS.watchId!=null){ try{ navigator.geolocation.clearWatch(GPS.watchId); }catch(e){} }
  GPS.watchId = null; GPS.watching = false;
}
function onGeoError(err){
  var code = err && err.code;
  if(code===1) GPS.error = "Localisation refusée pour ce site — autorise la position dans Chrome (icône 🔒/ⓘ dans la barre d'adresse → Autorisations du site → Position → Autoriser), puis réessaie.";
  else if(code===2) GPS.error = "Position indisponible — essaie à l'extérieur, à ciel ouvert.";
  else if(code===3) GPS.error = "Recherche du signal GPS trop longue — réessaie.";
  else GPS.error = "GPS indisponible — entrez la distance manuellement.";
  if(GPS.watchId!=null){ try{ navigator.geolocation.clearWatch(GPS.watchId); }catch(e){} GPS.watchId = null; }
  GPS.watching = false;
  render();
}
function startGPSWatch(){
  if(GPS.watching) return;
  if(!("geolocation" in navigator)){ GPS.error = "Géolocalisation non supportée par ce navigateur"; render(); return; }
  GPS.watching = true;
  GPS.watchId = navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  if(isGpsOnDemand()){
    if(GPS.safetyTimer) clearTimeout(GPS.safetyTimer);
    GPS.safetyTimer = setTimeout(function(){
      GPS.safetyTimer = null;
      if(!isGpsOnDemand() || !GPS.watching) return;
      gpsSleepKeepFix();
      if(!GPS.lastFix) GPS.error = "Pas de signal GPS après 45 s — GPS remis en veille pour la batterie. Tape la distance ou réessaie.";
      render();
    }, GPS_MAX_AWAKE_MS);
  }
}
// Version « GPS sur demande » : le GPS dort entre les coups pour économiser la batterie.
// On oublie la dernière position en l'endormant, pour ne jamais proposer une distance périmée.
function stopGPSWatch(){

}

// ---------------- Note vocale (Web Speech API — reconnaissance intégrée à Chrome, aucun serveur) ----------------
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var SpeechRecCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var VoiceNote = { active:false, hole:null, shotIdx:null, recognizer:null, silenceTimer:null, interim:"" };
function startVoiceNote(hole, shotIdx){
  if(!SpeechRecCtor){ alert("La reconnaissance vocale n'est pas supportée par ce navigateur — utilise Chrome."); return; }
  if(VoiceNote.active && VoiceNote.recognizer){ try{ VoiceNote.recognizer.stop(); }catch(e){} }
  var rec = new SpeechRecCtor();
  rec.lang = "fr-CA";
  rec.continuous = true;
  rec.interimResults = true;
  var finalText = "";
  var finalParts = [];
  VoiceNote.active = true;
  VoiceNote.hole = hole;
  VoiceNote.shotIdx = shotIdx;
  VoiceNote.recognizer = rec;
  VoiceNote.interim = "";
  function resetSilenceTimer(){
    if(VoiceNote.silenceTimer) clearTimeout(VoiceNote.silenceTimer);
    VoiceNote.silenceTimer = setTimeout(function(){ try{ rec.stop(); }catch(e){} }, 5000);
  }
  rec.onresult = function(e){
    var interim = "";
    for(var i=e.resultIndex; i<e.results.length; i++){
      var t = (e.results[i][0].transcript || "").trim();
      if(e.results[i].isFinal){
        // [fix 2026-10-01] Chrome Android renvoie la phrase CUMULÉE à chaque résultat : on remplace au lieu d'ajouter.
        if(finalParts.length && t.indexOf(finalParts[finalParts.length-1]) === 0) finalParts[finalParts.length-1] = t;
        else if(finalParts.length && finalParts[finalParts.length-1].indexOf(t) === 0) { /* déjà inclus */ }
        else if(t) finalParts.push(t);
        finalText = finalParts.join(" ") + " ";
      } else interim = t;
    }
    VoiceNote.interim = interim;
    resetSilenceTimer();
    render();
  };
  rec.onerror = function(e){
    if(VoiceNote.silenceTimer) clearTimeout(VoiceNote.silenceTimer);
    VoiceNote.active = false; VoiceNote.recognizer = null; VoiceNote.hole = null; VoiceNote.shotIdx = null; VoiceNote.interim = "";
    var msg = "Erreur du micro — réessaie.";
    if(e.error === "not-allowed" || e.error === "permission-denied") msg = "Micro refusé — autorise le micro pour ce site dans Chrome (Paramètres des sites), puis réessaie.";
    else if(e.error === "no-speech") msg = "Rien entendu, réessaie.";
    else if(e.error === "network") msg = "La reconnaissance vocale a besoin d'internet — vérifie ta connexion.";
    alert(msg);
    render();
  };
  rec.onend = function(){
    if(VoiceNote.silenceTimer) clearTimeout(VoiceNote.silenceTimer);
    var hd = ROUND.holes[hole];
    var text = (finalParts.length && VoiceNote.interim && VoiceNote.interim.indexOf(finalParts[finalParts.length-1]) === 0) ? VoiceNote.interim.trim() : (finalText + VoiceNote.interim).trim();
    if(text.length > 400) text = text.slice(-400);
    if(hd && hd.shots[shotIdx] && text){
      hd.shots[shotIdx].note = text;
      saveRound();
    }
    VoiceNote.active = false; VoiceNote.recognizer = null; VoiceNote.hole = null; VoiceNote.shotIdx = null; VoiceNote.interim = "";
    render();
  };
  resetSilenceTimer();
  try{ rec.start(); }catch(err){ VoiceNote.active = false; VoiceNote.recognizer = null; }
  render();
}
function stopVoiceNote(){
  if(VoiceNote.recognizer){ try{ VoiceNote.recognizer.stop(); }catch(e){} }
}
function voiceNoteButtonHTML(hole, i){
  if(ROUND.mode === "allegee") return ""; // version Allégée : pas de micro (réservé aux autres versions)
  if(VoiceNote.active && VoiceNote.hole===hole && VoiceNote.shotIdx===i){
    var interimHTML = VoiceNote.interim ? "<div class='voicenote interim'>"+escapeHtml(VoiceNote.interim)+"&hellip;</div>" : "";
    return "<button class='micbtn recording' onclick='App.stopVoiceNote()'>⏺ Écoute&hellip; (touche pour arrêter)</button>"+interimHTML;
  }
  return "<button class='micbtn' onclick='App.startVoiceNote("+hole+","+i+")'>🎤</button>";
}

    if(hdk.onGreen && UI.digits.length===2){
      var tk = puttTargetIndex(hdk);

  clearDigits:function(){

  confirmShot:function(after, spot, origFeet){
    var hd = getHole(ROUND.cur);
    var club = UI.locked || UI.pendingClub || defaultClubFor(hd);
    if(!club) return;
    var before = beforeDist(hd);
    var shown = UI.touched ? UI.digits : "";
    var val = (after!==undefined) ? after : (shown===""?0:parseInt(shown,10));
    // [fix 2026-10-01] Garde-fou : un gros bâton ne frappe pas 5 verges. Si la distance calculée est
    // absurdement courte, on demande confirmation au lieu de l'enregistrer en silence.
    var minPlausible = { "Cobra1":40, "Bois 1":40, "Bois 5":30, "Hybride 3":30, "Fer 7":15, "Fer 9":10 }[club];
    if(minPlausible && before!=null && val>0 && (before - val) < minPlausible && !spot){
      if(!confirm("Frappe de seulement "+Math.max(0,before-val)+" v avec "+club+" (reste "+val+" v). C'est bien ça ? OK = garder tel quel. Annuler = corriger la distance restante.")) return;
    }
    var shot = { club:club, before:before, after:val };
    if(spot) shot.spot = spot;
    if(origFeet!=null) shot.origFeet = origFeet;
    if(typeof Voice !== "undefined" && Voice.pendingNote){ shot.note = Voice.pendingNote; Voice.pendingNote = ""; }
    hd.shots.push(shot);
    UI.pendingClub=null; UI.locked=null; UI.digits=""; UI.touched=false; UI.gpsFilled=false; UI.awaitingSpot=false; UI.spotForShot=null;
    if(val===0){ hd.onGreen = true; UI.puttTarget=null; autoCapturePinIfPossible(); }

function puttTargetIndex(hd){
  if(UI.puttTarget!==null) return UI.puttTarget;
  for(var i=0;i<4;i++) if(hd.putts[i]===null) return i;
  return 3;
}
function commitPuttEdit(){
  if(!UI.touched) return;
  var hd = getHole(ROUND.cur);
  var i = puttTargetIndex(hd);
  hd.putts[i] = UI.digits===""?null:parseInt(UI.digits,10);
}

function puttCount(hd){
  return hd.putts.filter(function(p){ return p!==null; }).length;
}
function autoScore(hd){
  var n = hd.shots.length;
  if(hd.onGreen){
    var t = puttTargetIndex(hd);
    for(var i=0;i<4;i++){
      var v = hd.putts[i];
      if(i===t && UI.touched && UI.digits!=="") v = UI.digits;
      if(v!==null) n++;
    }
  } else if(UI.locked){
    n += 1; // le coup a été frappé (bâton verrouillé), juste pas encore mesuré
  }
  return n;
}
function shotListHTML(hd){
  var confirmed = hd.shots.map(function(s,i){
    var dist = s.before - s.after;
    var mic = voiceNoteButtonHTML(ROUND.cur, i);
    var noteLine = s.note ? "<div class='voicenote'>🎤 "+escapeHtml(s.note)+"</div>" : "";
    var spotShort = s.spot === "Trappe de sable" ? "Sable" : s.spot;
    var spotTag = s.spot ? " <b style='color:var(--amber)'>&mdash; "+escapeHtml(spotShort)+"</b>" : "";
    var isPutter = s.club === "Putter";
    var distTxt = isPutter ? Math.round(dist*3)+" pieds" : dist+"v";
    var resteTxt = isPutter ? Math.round(s.after*3)+" pieds" : s.after+"v"+(s.origFeet!=null ? " ("+s.origFeet+" pieds)" : "");
    if(s.after===0){
      return "<div><b>C"+(i+1)+" "+s.club+"</b> — Frappe de <b>"+distTxt+"</b>, vous êtes sur le vert"+spotTag+" "+mic+"</div>"+noteLine;
    }
    return "<div><b>C"+(i+1)+" "+s.club+"</b> — Frappe de <b>"+distTxt+"</b>, reste <b>"+resteTxt+"</b>"+spotTag+" "+mic+"</div>"+noteLine;
  }).join("");
  var pending = "";
  if(!hd.onGreen && UI.locked){
    var n = hd.shots.length+1;
    pending = "<div><b>C"+n+" "+UI.locked+"</b> — frappe faite, distance à venir&hellip;</div>";
  }
  if(hd.shots.length===0 && !pending) return "Aucun coup enregistré.";
  return confirmed + pending;
}
// La 1re case n'est pas un coup roulé : c'est la distance en pieds en arrivant sur
// le vert. Chaque coup roulé va d'une case à la suivante (longueur = case[m] - case[m+1]).
// Le tout dernier coup roulé (celui qui rentre la balle) n'a pas sa propre case --
// sa longueur est simplement la valeur de la dernière case remplie.
function puttsListHTML(hd){
  if(!hd.onGreen) return "";
  var target = puttTargetIndex(hd);
  var liveTyping = UI.touched && UI.digits!=="";
  var filled = [];
  for(var i=0;i<4;i++){
    var v = hd.putts[i];
    if(v===null && i===target && liveTyping) v = parseInt(UI.digits,10);
    if(v===null || v===undefined) break;
    filled.push(v);
  }
  var k = filled.length;
  if(k===0) return "";
  var ORD = ["1er","2e","3e","4e"];
  var lines = [];
  for(var m=0; m<k-1; m++){
    var n = hd.shots.length + m + 1;
    var length = filled[m] - filled[m+1];
    lines.push("<div><b>C"+n+" Putter</b> — "+ORD[m]+" roulé de <b>"+length+" pieds</b>, vous êtes maintenant à <b>"+filled[m+1]+" pieds</b></div>");
  }
  var nFinal = hd.shots.length + k;
  var lastIsLiveUncommitted = (target===k-1) && liveTyping && hd.putts[target]===null;
  if(lastIsLiveUncommitted){
    lines.push("<div><b>C"+nFinal+" Putter</b> — "+ORD[k-1]+" roulé en cours&hellip; (actuellement à "+filled[k-1]+" pieds)</div>");
  } else {
    lines.push("<div><b>C"+nFinal+" Putter</b> — "+ORD[k-1]+" roulé de <b>"+filled[k-1]+" pieds</b>, rentré !</div>");
  }
  return lines.join("");
}
function shotsCardHTML(hd){
  var sc = hd.score!==null ? hd.score : autoScore(hd);
  var header = "<div style='display:flex;align-items:baseline;gap:7px'>" +
    "<input class='scoreinput' style='width:42px;height:42px;line-height:42px;font-size:1.15rem;padding:0;text-align:center' type='number' inputmode='numeric' value='"+(sc!==null?sc:"")+"' onchange='App.setScore(this.value)'>" +
    "<h2>coups joués sur ce trou</h2>" +
  "</div>";
  return "<div class='card'>"+header+"<div class='shotlist'>"+shotListHTML(hd)+puttsListHTML(hd)+"</div></div>";
}

function keypadHTML(defaultVal, showDisplay){

function gpsStatusHTML(hd){
  if(isGpsOnDemand() && GPS.watching && !UI.gpsFilled && !GPS.error){
    return "<div class='gpsnote'>&#128225; GPS allumé — recherche de ta position (il s'éteint tout seul dès qu'il l'a, maximum 45 s)</div>";
  }
  if(isGpsOnDemand() && !GPS.watching && !UI.gpsFilled){
    return "<button class='shotbtn' style='background:var(--accent);white-space:normal;line-height:1.25' onclick='App.wakeGPS()'>&#128205; Cliquez quand vous serez rendu à votre balle</button>" +
      "<div class='gpsnote'>&#128267; GPS éteint pendant que tu marches — il s'allume seulement quand tu touches ce bouton, arrivé à ta balle (ou tape la distance)</div>";
  }
  if(UI.gpsFilled){
    var acc = (GPS.lastFix && GPS.lastFix.accuracy) ? " (±"+Math.round(GPS.lastFix.accuracy)+"m)" : "";
    var pin = getPinGPS(ROUND.course, ROUND.cur);
    var src = pin ? (pin.source==="google-earth" ? "depuis le drapeau (Google Earth)" : "depuis le drapeau enregistré") : "estimée depuis le départ";
    var raw = rawSuggestedRemaining(hd);
    if(raw != null && raw > MAX_REALISTIC_VERGES){
      return "<div class='gpsnote bad'>📍 Distance suggérée par GPS"+acc+" — "+src+", mais elle semble irréaliste (peut-être pas encore sur le terrain) — vérifie et corrige au besoin ci-dessous</div>";
    }
    return "<div class='gpsnote ok'>📍 Distance suggérée par GPS"+acc+" — "+src+", modifiable ci-dessous</div>";
  }
  if(GPS.error){
    return "<div class='gpsnote bad'>📍 "+GPS.error+" <button class='linklike' onclick='App.retryGPS()'>réessayer</button></div>";
  }
  if(!GPS.lastFix){
    return "<div class='gpsnote'>📍 Recherche du signal GPS&hellip;</div>";
  }
  return "";
}

function verifierMiseAJour(){

  fetch(location.pathname + '?verif=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.text(); }).then(function(t){

    if(!d || d.length<16){
      var a = new Uint8Array(12); (window.crypto||window.msCrypto).getRandomValues(a); d = "";

  var done = false;

  try{
    fetch(LIC_API+"/activate", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({code:code, device:licDevice()})})
      .then(function(r){ return r.json(); })
      .then(function(j){ fin(j); })
      .catch(function(){ fin({ok:false, net:true}); });
  }catch(e){ fin({ok:false, net:true}); }

// ---------------- [2026-10-02] Historique cumulé + Recommandations ----------------
// Chaque ronde terminée (Fin / Exporter, ou Effacer la ronde) est rangée dans l'historique du cell.
// Les stats cumulées = historique + ronde en cours. Les « coups manqués » (sous le seuil du bâton) ne comptent jamais.
var HISTORY_KEY = "golfgpsplus_history_v1";
var MISS_THRESHOLDS = { "Cobra1":150, "Bois 1":150, "Hybride 3":125, "Bois 5":100, "Fer 7":85, "Fer 9":60 };
// [2026-10-04] Fer 8 joué à 50 v ou moins du vert = approche sans élan : stat à part, hors de la force réelle du Fer 8.
var FER8_NEAR = "Fer 8 près du vert", NEAR_GREEN_MAX_V = 50;
CLUB_SHORT[FER8_NEAR] = "Fer 8 près vert";
function baseClub(c){ return c === FER8_NEAR ? "Fer 8" : c; }
function statClub(club, before){ return (club === "Fer 8" && before != null && before <= NEAR_GREEN_MAX_V) ? FER8_NEAR : club; }
function isMissedShot(club, dist){ return MISS_THRESHOLDS[club] != null && dist < MISS_THRESHOLDS[club]; }
// RONDES D'ESSAI : les 5 dernières rondes de Claude, pour tester les recommandations. À VIDER (mettre []) avant la vente.
var SEED_TEST_ROUNDS = [];
function loadHistory(){
  try{
    var raw = localStorage.getItem(HISTORY_KEY);
    if(raw === null){
      var h = SEED_TEST_ROUNDS.slice();
      localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
      return h;
    }
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return SEED_TEST_ROUNDS.slice(); }
}
function saveHistory(h){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }catch(e){} }
function currentRoundId(){ return (ROUND.date || todayISO()) + "|" + (ROUND.course || "") + "|" + (ROUND.tee || ""); }
// Résume la ronde en cours : coups pleins [bâton, distance] + nombre de roulés par trou (le Putter hors du vert compte aussi).
function roundToEntry(){
  var shots = [], putts = [], holesOut = [];
  Object.keys(ROUND.holes).map(Number).sort(function(a,b){ return a-b; }).forEach(function(n){
    var h = ROUND.holes[n], pc = 0;
    h.shots.forEach(function(s){
      if(s.club === "Putter") pc++;
      else shots.push([s.club, s.before - s.after, s.before]);
    });
    pc += puttCount(h);
    if(h.shots.length>0 || pc>0) putts.push(pc);
    if(h.shots.length>0 || pc>0){
      // [2026-10-04] détail trou par trou (pour les rapports) : coups [bâton, avant, après, endroit] + roulés en pieds
      var hh = { n:n, par:h.par, d:h.startDist, sh:[], pt:[] };
      h.shots.forEach(function(s){ hh.sh.push([s.club, s.before, s.after, s.spot||""]); });
      for(var pi=0; pi<4; pi++){ if(h.putts[pi]===null) break; hh.pt.push(h.putts[pi]); }
      if(h.score!==null) hh.sc = h.score;
      holesOut.push(hh);
    }
  });
  return { id:currentRoundId(), date:ROUND.date || todayISO(), course:ROUND.course, tee:ROUND.tee, shots:shots, putts:putts, holes:holesOut };
}
function archiveCurrentRound(){
  try{
    var e = roundToEntry();
    if(e.shots.length === 0) return;
    var hist = loadHistory(), found = false;
    for(var i=0;i<hist.length;i++){ if(hist[i].id === e.id){ hist[i] = e; found = true; break; } }
    if(!found) hist.push(e);
    saveHistory(hist);
    // Tous les 10 rondes : on propose une sauvegarde (courriel / fichier)
    try{
      var last = parseInt(localStorage.getItem("golfgps_backup_asked")||"0",10);
      if(!found && hist.length>=10 && hist.length%10===0 && last<hist.length){
        localStorage.setItem("golfgps_backup_asked", String(hist.length));
        setTimeout(function(){ App.openBackup(); }, 400);
      }
    }catch(e2){}
  }catch(err){}
}
// Toutes les rondes (historique sans la ronde en cours, puis la ronde en cours) — seulement les bâtons du sac actuel.
function combinedData(){
  var curId = currentRoundId(), cur = roundToEntry();
  var rounds = loadHistory().filter(function(r){ return r.id !== curId; });
  var nHist = rounds.length;
  if(cur.shots.length > 0) rounds.push(cur);
  var shots = [], puttTotal = 0, puttHoles = 0;
  rounds.forEach(function(r){
    (r.shots||[]).forEach(function(s){ if(CLUBS.indexOf(s[0]) >= 0 && s[1] > 0) shots.push({ club:statClub(s[0], s[2] != null ? s[2] : s[1]), dist:s[1] }); });
    (r.putts||[]).forEach(function(p){ puttTotal += p; puttHoles++; });
  });
  // [2026-10-04] Coup aberrant : un Hybride 3 à 221 v (lecture GPS fausse) est remplacé, dans les stats, par la moyenne des bons coups d'Hybride 3.
  var aber = shots.filter(function(s){ return s.club === "Hybride 3" && s.dist === 221; });
  if(aber.length){
    var bons = shots.filter(function(s){ return s.club === "Hybride 3" && s.dist !== 221 && !isMissedShot("Hybride 3", s.dist); });
    if(bons.length){
      var moy = Math.round(bons.reduce(function(a,s){ return a + s.dist; }, 0) / bons.length);
      aber.forEach(function(s){ s.dist = moy; });
    }
  }
  var curP = 0; cur.putts.forEach(function(p){ curP += p; });
  return { shots:shots, nHist:nHist, hasCurrent:cur.shots.length>0, curShots:cur.shots.length,
           puttAvg: puttHoles ? puttTotal/puttHoles : null, puttHoles:puttHoles,
           curPuttAvg: cur.putts.length ? curP/cur.putts.length : null };
}
// Recommandation : parmi les coups RÉUSSIS (jamais les manqués), quel bâton a le plus souvent fait cette distance ?
// Le driver (Cobra1) ne se joue que du tee : après le coup de départ, il n'est jamais recommandé.
function recommendClubs(D, teeShot){
  var shots = combinedData().shots.filter(function(s){
    if(isMissedShot(s.club, s.dist)) return false;
    if(!teeShot && (s.club === "Cobra1" || s.club === "Bois 1")) return false;
    if(s.club === FER8_NEAR && D > NEAR_GREEN_MAX_V) return false;
    return true;
  });
  // On élargit la fenêtre (±10, ±15, ±25, ±40 v) jusqu'à avoir AU MOINS 2 bâtons à proposer.
  var widths = [10, 15, 25, 40], list = [], usedW = widths[0];
  for(var w=0; w<widths.length; w++){
    var W = widths[w], rows = {};
    usedW = W;
    shots.forEach(function(s){
      if(Math.abs(s.dist - D) > W) return;
      var r = rows[s.club] || (rows[s.club] = { club:s.club, n:0, sum:0 });
      r.n++; r.sum += s.dist;
    });
    list = Object.keys(rows).map(function(c){ var r = rows[c]; r.avg = Math.round(r.sum/r.n); return r; });
    if(list.length >= 2) break;
  }
  list.sort(function(a,b){ return (b.n - a.n) || (Math.abs(a.avg-D) - Math.abs(b.avg-D)); });
  var fallback = false;
  if(list.length < 2){
    // Pas assez de coups réussis à cette distance : on complète avec les bâtons dont la moyenne est la plus proche.
    var all = {};
    shots.forEach(function(s){ var r = all[s.club] || (all[s.club] = { club:s.club, n:0, sum:0 }); r.n++; r.sum += s.dist; });
    var have = {}; list.forEach(function(r){ have[r.club] = true; });
    var extra = Object.keys(all).filter(function(c){ return !have[c]; }).map(function(c){ var r = all[c]; r.avg = Math.round(r.sum/r.n); return r; });
    extra.sort(function(a,b){ return Math.abs(a.avg-D) - Math.abs(b.avg-D); });
    while(list.length < 2 && extra.length){ list.push(extra.shift()); fallback = true; }
  }
  // Moyenne et meilleur coup = ceux du bâton sur TOUTES les rondes cumulées (précédentes + en cours), coups réussis seulement.
  var tot = {};
  shots.forEach(function(s){ var r = tot[s.club] || (tot[s.club] = { n:0, sum:0, best:0 }); r.n++; r.sum += s.dist; r.best = Math.max(r.best, s.dist); });
  list.forEach(function(r){ var T = tot[r.club]; r.winN = r.n; r.allN = T.n; r.avg = Math.round(T.sum/T.n); r.best = T.best; });
  return { W:usedW, list:list.slice(0,3), fallback:fallback };
}
function recoPanelHTML(D, teeShot){

  var h = "<div class='recopanel'><div class='recohead'>Il vous reste <b>"+D+" v</b></div>";

}function cumulPanelHTML(){

  h += "<div class='cumgrid cumhead'><span>Bâton</span><span>Réussis</span><span>Moyenne</span><span>Meilleur</span><span>Manqués</span></div>";

  }
  h += "<div class='lead' style='font-size:.72rem'>Moyenne et meilleur : coups réussis seulement. Manqué = sous le seuil du bâton (Cobra1 150 v, Hybride 3 125 v, Bois 5 100 v, Fer 7 85 v, Fer 9 60 v). « Fer 8 près vert » = Fer 8 joué à 50 v ou moins du vert (approche), compté à part et hors de la force du Fer 8.</div>";
  return h + "</div>";
}

function summaryHTML(){
  var agg = {};
  function addStat(club, dist){
    if(!agg[club]) agg[club] = {n:0,sum:0};
    agg[club].n++; agg[club].sum += dist;
  }
  Object.keys(ROUND.holes).forEach(function(n){
    var h = ROUND.holes[n];
    h.shots.forEach(function(s){
      if(s.club === "Putter") return; // le Putter est résumé séparément (roulés/trou), pas en distance
      var dist = s.before - s.after;
      addStat(statClub(s.club, s.before), dist);
    });
  });
  var clubs = Object.keys(agg);
  if(clubs.length===0) return "<div class='lead'>Aucun coup enregistré pour l'instant.</div>";
  var maxAvg = 0;
  clubs.forEach(function(c){ maxAvg = Math.max(maxAvg, agg[c].sum/agg[c].n); });
  return clubs.map(function(c){
    var avg = Math.round(agg[c].sum/agg[c].n);
    var pct = maxAvg>0 ? Math.round(avg/maxAvg*100) : 0;
    return "<div class='summarybar'><div class='name'>"+c+"</div><div class='track'><div class='fill' style='width:"+pct+"%'></div></div><div class='val'>"+avg+"v</div></div>";
  }).join("");
}
function puttsPerHoleHTML(){

function exportText(){
  // Date où la ronde a commencé (confirmation du départ), pas celle de l'export —
  // sinon une ronde exportée le lendemain portait la date du lendemain.
  var dateStr = ROUND.date || todayISO();
  var lines = [];
  if(LIC) lines.push("Licence : "+LIC.nom);
  lines.push("GolfGpsPlus - Ronde du "+dateStr);
  lines.push("Terrain : "+ROUND.course);
  lines.push("Départ : "+teeLabelOf(ROUND.tee));
  lines.push("");
  var holeNums = Object.keys(ROUND.holes).map(Number).sort(function(a,b){ return a-b; });
  holeNums.forEach(function(n){
    var h = ROUND.holes[n];
    if(h.shots.length===0 && puttCount(h)===0) return;
    var sc = h.score!==null ? h.score : (h.shots.length+puttCount(h));
    lines.push("Trou "+n+" (Par "+h.par+") — Score "+sc);
    h.shots.forEach(function(s,i){
      var dist = s.before-s.after;
      var spotSuffix = s.spot ? " — "+s.spot : "";
      var isPutter = s.club === "Putter";
      var distTxt = isPutter ? Math.round(dist*3)+" pieds" : dist+"v";
      var resteTxt = isPutter ? Math.round(s.after*3)+" pieds" : s.after+"v"+(s.origFeet!=null ? " / "+s.origFeet+" pieds" : "");
      lines.push("  C"+(i+1)+" "+s.club+" : "+distTxt+" (reste "+resteTxt+")"+spotSuffix);
      if(s.note) lines.push("    Note : "+s.note);
    });
    var puttVals = [];
    for(var i=0;i<4;i++){ if(h.putts[i]===null) break; puttVals.push(h.putts[i]); }
    var k = puttVals.length;
    if(k>0){
      var missed = [];
      for(var m=0;m<k-1;m++){
        var n2 = h.shots.length+m+1;
        var length = puttVals[m]-puttVals[m+1];
        lines.push("  C"+n2+" Roulé : "+length+"pi (reste "+puttVals[m+1]+"pi)");
        missed.push(length+"pi");
      }
      var nFinal = h.shots.length+k;
      lines.push("  C"+nFinal+" Roulé : "+puttVals[k-1]+"pi (rentré)");
      if(missed.length) lines.push("  Putts manqués : "+missed.join(", "));
    }
    lines.push("");
  });
  lines.push("--- Résumé par bâton ---");
  var agg = {};
  holeNums.forEach(function(n){
    ROUND.holes[n].shots.forEach(function(s){
      var dist = s.before-s.after;
      if(!agg[s.club]) agg[s.club] = {n:0,sum:0};
      agg[s.club].n++; agg[s.club].sum += dist;
    });
  });
  Object.keys(agg).forEach(function(c){
    lines.push(c+" : "+agg[c].n+" coups, moyenne "+Math.round(agg[c].sum/agg[c].n)+"v");
  });
  if(ROUND.voiceLog && ROUND.voiceLog.length){
    lines.push("");
    lines.push("--- Journal vocal (tout ce qui a été dit) ---");
    ROUND.voiceLog.forEach(function(e){
      lines.push(e.t+" "+(e.h ? "Trou "+e.h : "Départ")+" "+(e.ok ? "✓" : "?")+" « "+e.txt+" »"+(e.q ? "   (question : "+e.q+")" : ""));
    });
  }
  return lines.join("\n");
}

// ---------------- [2026-10-04] Rapports : rondes trou par trou, scores finaux, sauvegarde ----------------
UI.report = null; UI.reportSort = "date"; UI.openRound = null; UI.confirmDeleteId = null;
function allRoundsList(){
  var curId = currentRoundId(), cur = roundToEntry();
  var list = loadHistory().filter(function(r){ return r.id !== curId; }).map(function(r){ return { r:r, cur:false }; });
  if(cur.shots.length > 0) list.push({ r:cur, cur:true });
  return list;
}
function holeStrokes(H){ return H.sc != null ? H.sc : (H.sh.length + H.pt.length); }
function roundTotals(r){
  if(!r.holes || !r.holes.length) return { score:null, par:null, putts:null, n:0 };
  var sc = 0, par = 0, pu = 0;
  r.holes.forEach(function(H){ sc += holeStrokes(H); par += H.par; pu += H.pt.length; });
  return { score:sc, par:par, putts:pu, n:r.holes.length };
}
function diffTxt(d){ return d === 0 ? "0" : (d > 0 ? "+" : "") + d; }
// Catégorie d'une ronde : "9" = 9 trous (ou moins), "18" = ronde complète, "p" = partielle (10 à 17 trous), "?" = sans détail
function roundCat(r){ var n = roundTotals(r).n; return n === 0 ? "?" : n <= 9 ? "9" : n >= 18 ? "18" : "p"; }
function filteredRounds(){
  var f = UI.reportFilter || "tous", l = allRoundsList();
  if(f === "tous") return l;
  return l.filter(function(x){ return roundCat(x.r) === f; });
}
// Statistiques d'une liste de rondes (score brut, écart au par, moyenne)
function listStats(l){
  var sc = [], df = [];
  l.forEach(function(x){ var t = roundTotals(x.r); if(t.score != null){ sc.push(t.score); df.push(t.score - t.par); } });
  if(!sc.length) return null;
  var add = function(a){ return a.reduce(function(x,y){ return x+y; }, 0); };
  return { n:sc.length, best:Math.min.apply(null,sc), bestDiff:Math.min.apply(null,df), avg:add(sc)/sc.length, avgDiff:add(df)/df.length };
}
function statsLineText(label, l){
  var s = listStats(l); if(!s) return null;
  return label+" : "+s.n+" ronde"+(s.n>1?"s":"")+" · meilleur "+s.best+" ("+diffTxt(s.bestDiff)+") · moyenne "+s.avg.toFixed(1)+" ("+(s.avgDiff>=0?"+":"")+s.avgDiff.toFixed(1)+")";
}
function sortedRounds(){
  var l = filteredRounds();
  if(UI.reportSort === "meilleur"){
    // Classement par écart au par (un 41 sur 9 trous n'est pas comparable à un 85 sur 18) ; rondes partielles / sans score à la fin
    l.sort(function(a,b){
      var ta = roundTotals(a.r), tb = roundTotals(b.r);
      var sa = ta.score == null ? 9999 : ta.score - ta.par, sb = tb.score == null ? 9999 : tb.score - tb.par;
      if(ta.score != null && roundCat(a.r) === "p") sa += 500;
      if(tb.score != null && roundCat(b.r) === "p") sb += 500;
      return sa - sb || (a.r.date < b.r.date ? 1 : -1);
    });
  } else {
    l.sort(function(a,b){ return a.r.date < b.r.date ? 1 : a.r.date > b.r.date ? -1 : 0; });
  }
  return l;
}
function roundTitle(r){ return r.date + " — " + (r.course||"") + (r.tee ? " (départ "+teeLabelOf(r.tee)+")" : ""); }
function holeLinesText(H){
  var tot = holeStrokes(H), lines = [];
  lines.push("Trou "+H.n+" · Par "+H.par+(H.d?" · "+H.d+" v":"")+" · Score "+tot+" ("+diffTxt(tot-H.par)+")");
  H.sh.forEach(function(s,i){
    var club = s[0], before = s[1], after = s[2], spot = s[3];
    if(club === "Putter") lines.push("  C"+(i+1)+" Putter : "+Math.round((before-after)*3)+" pieds"+(spot?" — "+spot:""));
    else lines.push("  C"+(i+1)+" "+club+" : "+(before-after)+" v → "+(after>0 ? "reste "+after+" v" : "sur le vert")+(spot?" ("+spot+")":""));
  });
  if(H.pt.length){
    var seq = H.pt.map(function(v,k){ return k < H.pt.length-1 ? v+" pi" : v+" pi (rentré)"; });
    lines.push("  Roulés : "+seq.join(" → ")+" ("+H.pt.length+" roulé"+(H.pt.length>1?"s":"")+")");
  }
  return lines;
}
function roundReportText(r){
  var t = roundTotals(r), L = [];
  L.push("RONDE DU "+roundTitle(r));
  if(t.score != null) L.push("Score "+t.score+" (par "+t.par+", "+diffTxt(t.score-t.par)+") · Roulés "+t.putts+" ("+(t.putts/t.n).toFixed(2)+" par trou)"+(t.n<18?" · "+t.n+" trous joués":""));
  L.push("");
  if(!r.holes || !r.holes.length){
    L.push("(Ronde enregistrée avant le détail trou par trou : seulement les coups par bâton)");
    var by = {}; (r.shots||[]).forEach(function(s){ (by[s[0]] = by[s[0]] || []).push(s[1]); });
    Object.keys(by).forEach(function(c){ var a = by[c]; L.push("  "+c+" : "+a.length+" coups, moyenne "+Math.round(a.reduce(function(x,y){return x+y;},0)/a.length)+" v"); });
    return L.join("\n");
  }
  r.holes.forEach(function(H){ holeLinesText(H).forEach(function(x){ L.push(x); }); L.push(""); });
  return L.join("\n");
}
function scoresReportText(){
  var l = sortedRounds(), L = [];
  var flt = UI.reportFilter || "tous";
  L.push("SCORES FINAUX — "+(flt==="9"?"rondes de 9 trous":flt==="18"?"rondes de 18 trous":"toutes les rondes")+" — "+(UI.reportSort==="meilleur" ? "classées du meilleur écart au par au moins bon" : "du plus récent au plus ancien"));
  if(LIC) L.push("Licence : "+LIC.nom);
  l.forEach(function(x,i){
    var t = roundTotals(x.r);
    L.push((i+1)+". "+x.r.date+" · "+(x.r.course||"")+(x.r.tee?" ("+teeLabelOf(x.r.tee)+")":"")+" · "+(t.score!=null ? t.n+" trous · Score "+t.score+" ("+diffTxt(t.score-t.par)+") · "+t.putts+" roulés" : "score non disponible")+(x.cur?" · en cours":""));
  });
  var sums = [];
  if(flt === "tous" || flt === "18") sums.push(statsLineText("18 trous", l.filter(function(x){ return roundCat(x.r)==="18"; })));
  if(flt === "tous" || flt === "9") sums.push(statsLineText("9 trous", l.filter(function(x){ return roundCat(x.r)==="9"; })));
  sums = sums.filter(Boolean);
  if(sums.length){ L.push(""); sums.forEach(function(s){ L.push(s); }); }

// ----- PDF sur demande (sans bibliothèque) : texte en police Courier, pages Lettre, accents conservés -----
function pdfBytesFromText(text){
  var map = { 0x2014:0x97, 0x2013:0x96, 0x2019:0x92, 0x2018:0x91, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x20AC:0x80 };
  var clean = String(text).replace(/→/g,"->").replace(/[✔✓]/g,"OK").replace(/\r/g,"");
  var enc8 = function(s){
    var o = ""; for(var i=0;i<s.length;i++){ var c = s.charCodeAt(i); if(map[c]) c = map[c]; else if(c > 255) c = 63; o += String.fromCharCode(c); }
    return o;
  };
  var MAXC = 96, lines = [];
  clean.split("\n").forEach(function(raw){
    var line = raw.replace(/\t/g,"  ");
    if(line.length <= MAXC){ lines.push(line); return; }
    var indent = (line.match(/^\s*/)||[""])[0], rest = line;
    while(rest.length > MAXC){
      var cut = rest.lastIndexOf(" ", MAXC); if(cut < MAXC/2) cut = MAXC;
      lines.push(rest.slice(0, cut)); rest = indent + "  " + rest.slice(cut).replace(/^\s+/,"");
    }
    lines.push(rest);
  });
  var PER = 62, pages = [];
  for(var i=0;i<lines.length;i+=PER) pages.push(lines.slice(i, i+PER));
  if(!pages.length) pages.push([""]);
  var esc = function(s){ return enc8(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); };
  var objs = [];
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  var kids = pages.map(function(p,k){ return (4+2*k)+" 0 R"; }).join(" ");
  objs[2] = "<< /Type /Pages /Kids [ "+kids+" ] /Count "+pages.length+" >>";
  objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>";
  pages.forEach(function(p,k){
    var body = "BT /F1 9 Tf 11 TL 40 752 Td\n";
    p.forEach(function(l){ body += "("+esc(l)+") Tj T*\n"; });
    body += "ET";
    objs[4+2*k] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents "+(5+2*k)+" 0 R >>";
    objs[5+2*k] = "<< /Length "+body.length+" >>\nstream\n"+body+"\nendstream";
  });
  var out = "%PDF-1.4\n", offs = [];
  for(var n=1;n<objs.length;n++){ offs[n] = out.length; out += n+" 0 obj\n"+objs[n]+"\nendobj\n"; }
  var xref = out.length;
  out += "xref\n0 "+objs.length+"\n0000000000 65535 f \n";
  for(var m=1;m<objs.length;m++) out += ("0000000000"+offs[m]).slice(-10)+" 00000 n \n";
  out += "trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var u8 = new Uint8Array(out.length); for(var q=0;q<out.length;q++) u8[q] = out.charCodeAt(q) & 255;
  return u8;
}
function sharePdf(name, text, title){
  var blob = new Blob([pdfBytesFromText(text)], { type:"application/pdf" });
  try{
    var file = new File([blob], name, { type:"application/pdf" });
    if(isMobileDevice() && navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:title||"GolfGpsPlus", text:title||"GolfGpsPlus" }).catch(function(){});
      return "share";
    }
  }catch(e){}
  try{
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 800);
    return "download";
  }catch(e2){ return "error"; }
}

function restoreFromText(txt){
  var o; try{ o = JSON.parse(String(txt).replace(/^﻿/,"")); }catch(e){ return { ok:false, msg:"Ce fichier n'est pas une sauvegarde GolfGpsPlus valide." }; }
  if(!o || (o.app !== "GolfGpsPlus" && o.app !== "GolfGPS") || !Array.isArray(o.rondes)) return { ok:false, msg:"Ce fichier n'est pas une sauvegarde GolfGpsPlus valide." };
  var hist = loadHistory(), added = 0, replaced = 0;
  o.rondes.forEach(function(r){
    if(!r || !r.id || !Array.isArray(r.shots)) return;
    var i = -1; for(var k=0;k<hist.length;k++){ if(hist[k].id === r.id){ i = k; break; } }
    if(i >= 0){ hist[i] = r; replaced++; } else { hist.push(r); added++; }
  });
  saveHistory(hist);

function sortRoundsBy(l, mode){
  l = l.slice();
  if(mode === "meilleur"){
    l.sort(function(a,b){
      var ta = roundTotals(a.r), tb = roundTotals(b.r);
      var sa = ta.score == null ? 9999 : ta.score - ta.par, sb = tb.score == null ? 9999 : tb.score - tb.par;
      if(ta.score != null && roundCat(a.r) === "p") sa += 500;
      if(tb.score != null && roundCat(b.r) === "p") sb += 500;
      return sa - sb || (a.r.date < b.r.date ? 1 : -1);
    });
  } else l.sort(function(a,b){ return a.r.date < b.r.date ? 1 : a.r.date > b.r.date ? -1 : 0; });
  return l;
}

// ---------------- Version PARLÉE : commandes vocales (Web Speech API de Chrome) ----------------
// Appuie sur le gros micro, dis une ou plusieurs commandes d'affilée (« fer 7 fairway »),
// l'appli les exécute dans l'ordre et répond à voix haute. L'écran normal reste utilisable.
var Voice = {
  listening:false, rec:null, heard:"", reply:"", replyErr:false,
  handsFree:false, speakBack:true, wakeLock:null, restartTimer:null,

  supported:function(){ return !!SpeechRecCtor; },

  barHTML:function(){
    if(!isVoiceMode()) return "";
    var h = "<div class='voicebar'><div class='voicebar-in'>";
    if(!this.supported()){
      h += "<div class='voicereply err'>La reconnaissance vocale n'est pas disponible ici — ouvre l'appli dans Chrome.</div>";
      return h + "</div></div>";
    }
    h += "<div class='voiceheard'>"+(this.heard ? "J'ai entendu : <b>« "+escapeHtml(this.heard)+" »</b>" : "Appuie sur le micro et parle")+"</div>";
    h += "<div class='voicereply"+(this.replyErr?" err":"")+"'>"+escapeHtml(this.reply||"")+"</div>";
    h += "<button class='bigmic"+(this.listening?" listening":"")+"' onclick='Voice.toggle()'>"+(this.listening?"&#9210; J'écoute&hellip; (touche pour arrêter)":"&#127908; Parler")+"</button>";
    h += "<div class='voiceopts'>";
    h += "<button class='btn-ghost' onclick='Voice.toggleHandsFree()'>"+(this.handsFree?"&#9989; Écoute continue":"&#11036; Écoute continue")+"</button>";
    h += "<button class='btn-ghost' onclick='Voice.toggleSpeakBack()'>"+(this.speakBack?"&#128266; Réponse à voix haute":"&#128263; Réponse muette")+"</button>";
    h += "<button class='btn-ghost' onclick='Voice.say(Voice.statusPhrase())'>&#10067; Où j'en suis</button>";
    h += "</div></div></div>";
    return h;
  },

  onModeChosen:function(){
    this.reply = "Appuie sur le micro et dis ton terrain et ton départ.";
    this.keepScreenOn();
    render();
  },

  toggle:function(){ if(this.listening) this.stop(); else this.start(); },
  toggleHandsFree:function(){
    this.handsFree = !this.handsFree;
    if(this.handsFree && !this.listening) this.start();
    if(!this.handsFree && this.listening) this.stop();
    render();
  },
  toggleSpeakBack:function(){
    this.speakBack = !this.speakBack;
    try{ if(!this.speakBack) window.speechSynthesis.cancel(); }catch(e){}
    render();
  },

  keepScreenOn:function(){
    try{
      if("wakeLock" in navigator && !this.wakeLock){
        navigator.wakeLock.request("screen").then(function(l){
          Voice.wakeLock = l;
          l.addEventListener("release", function(){ Voice.wakeLock = null; });
        }).catch(function(){});
      }
    }catch(e){}
  },

  start:function(){
    if(!this.supported() || this.listening) return;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    this.keepScreenOn();
    var rec = new SpeechRecCtor();
    rec.lang = "fr-CA";
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    var gotFinal = false;
    rec.onresult = function(e){
      var res = e.results[e.results.length-1];
      Voice.heard = res[0].transcript;
      if(res.isFinal){
        gotFinal = true;
        var alts = [];
        for(var i=0;i<res.length;i++) alts.push(res[i].transcript);
        Voice.handle(alts);
      } else {
        render();
      }
    };
    rec.onerror = function(e){
      if(e.error === "not-allowed" || e.error === "service-not-allowed"){
        Voice.handsFree = false;
        Voice.setReply("Micro refusé — autorise le micro pour ce site dans Chrome (Paramètres des sites).", true);
      } else if(e.error === "network"){
        Voice.setReply("La reconnaissance vocale a besoin d'internet (données cellulaires).", true);
      } else if(e.error === "no-speech" || e.error === "aborted"){
        // silence : rien à dire
      } else {
        Voice.setReply("Erreur du micro ("+e.error+") — réessaie.", true);
      }
    };
    rec.onend = function(){
      Voice.listening = false; Voice.rec = null;
      render();
      if(Voice.handsFree) Voice.restartSoon();
    };
    this.rec = rec;
    this.listening = true;
    try{ rec.start(); }catch(err){ this.listening = false; this.rec = null; }
    render();
  },

  stop:function(){
    this.handsFree = false;
    if(this.restartTimer){ clearTimeout(this.restartTimer); this.restartTimer = null; }
    if(this.rec){ try{ this.rec.abort(); }catch(e){} }
    this.listening = false; this.rec = null;
  },

  // En écoute continue, on attend que la réponse parlée soit finie avant de réécouter
  // (sinon le micro entendrait la voix du cell).
  restartSoon:function(){
    if(this.restartTimer) clearTimeout(this.restartTimer);
    this.restartTimer = setTimeout(function tick(){
      Voice.restartTimer = null;
      if(!Voice.handsFree || document.hidden) return;
      var speaking = false;
      try{ speaking = window.speechSynthesis.speaking; }catch(e){}
      if(speaking){ Voice.restartTimer = setTimeout(tick, 300); return; }
      Voice.start();
    }, 400);
  },

  setReply:function(txt, isErr){
    this.reply = txt; this.replyErr = !!isErr;
    render();
    this.say(txt);
  },

  say:function(txt){
    if(!this.speakBack || !txt || !window.speechSynthesis) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(txt.replace(/—/g, ","));
      u.lang = "fr-CA";
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    }catch(e){}
  },

  // ---------- compréhension de la phrase ----------
  // Tout ce qui est dit est gardé dans le journal (exporté avec la ronde).
  // Une phrase non comprise n'est jamais redemandée : elle est notée sur le coup
  // en cours et on attend la suite ; « suivant » fait passer à l'étape suivante.
  pendingNote:"",
  log:function(text, ok){
    if(!ROUND.voiceLog) ROUND.voiceLog = [];
    var d = new Date();
    ROUND.voiceLog.push({
      t: String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),
      h: ROUND.setupConfirmed ? ROUND.cur : 0,
      q: this.nextPrompt(),
      txt: text,
      ok: ok
    });
    saveRound();
  },
  keepAsNote:function(text){
    if(!ROUND.setupConfirmed) return;
    var hd = getHole(ROUND.cur);
    if(hd.onGreen && hd.shots.length){
      var s = hd.shots[hd.shots.length-1];
      s.note = s.note ? s.note+" · "+text : text;
      saveRound();
    } else {
      this.pendingNote = this.pendingNote ? this.pendingNote+" · "+text : text;
    }
  },
  handle:function(alts){
    var best = null;
    for(var i=0;i<alts.length;i++){
      var cmds = parseVoice(alts[i]);
      if(cmds.length){ best = { text:alts[i], cmds:cmds }; break; }
    }
    if(!best){
      this.heard = alts[0];
      this.log(alts[0], false);
      if(!ROUND.setupConfirmed){
        this.setReply("Dis ton terrain et ton départ, par exemple : Cacouna, blancs, c'est parti", true);
        return;
      }
      this.keepAsNote(alts[0]);
      this.setReply("Noté. Dis suivant pour passer à l'étape suivante", false);
      return;
    }
    this.heard = best.text;
    this.log(best.text, true);
    var said = [], err = null, noPrompt = false;
    for(var j=0;j<best.cmds.length;j++){
      var r = runVoiceCommand(best.cmds[j]);
      if(r && r.err){ err = r.err; break; }
      if(r && r.say) said.push(r.say);
      noPrompt = !!(r && r.noPrompt);
    }
    if(err){
      this.keepAsNote(best.text);
      this.setReply(said.concat([err, "Noté quand même, dis suivant pour continuer"]).join(". "), true);
      return;
    }
    var next = noPrompt ? "" : this.nextPrompt();
    this.setReply(said.concat(next ? [next] : []).join(". "), false);
  },

  // Ce que l'appli attend maintenant, dit en une courte phrase.
  nextPrompt:function(){
    if(!ROUND.setupConfirmed){
      if(!ROUND.course) return "Quel terrain ?";
      if(!ROUND.tee) return "Départ : "+teesText(ROUND.course)+" ?";
      return "Dis c'est parti pour commencer.";
    }
    var hd = getHole(ROUND.cur);
    if(hd.onGreen){
      if(hd.putts[0]===null) return "Sur le vert. À combien de pieds du trou ?";
      return "Roulé suivant, à combien de pieds ? Ou dis rentré.";
    }
    if(UI.locked && UI.awaitingSpot) return "Où est tombée la balle ?";
    if(UI.locked) return "Marche vers ta balle, puis dis le prochain bâton";
    return "Quel bâton ?";
  },

  statusPhrase:function(){
    if(!ROUND.setupConfirmed) return this.nextPrompt();
    var hd = getHole(ROUND.cur);
    var p = "Trou "+ROUND.cur+", par "+hd.par+". ";
    if(hd.onGreen) return p + "Tu es sur le vert. " + this.nextPrompt();
    if(UI.locked){
      var d = UI.digits!=="" ? "Il reste environ "+UI.digits+" verges. " : "";
      return p + "Coup au "+UI.locked+". " + d + this.nextPrompt();
    }
    return p + "Il reste "+beforeDist(hd)+" verges. " + this.nextPrompt();
  }
};

// ---------- nombres dits en lettres → chiffres ----------
var NUM_WORDS = { zero:0, un:1, une:1, deux:2, trois:3, quatre:4, cinq:5, six:6, sept:7, huit:8, neuf:9, dix:10,
  onze:11, douze:12, treize:13, quatorze:14, quinze:15, seize:16, vingt:20, vingts:20, trente:30, quarante:40,
  cinquante:50, soixante:60, cent:100, cents:100 };
function normalizeVoice(txt){
  var t = (txt||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  t = t.replace(/(\d)\s*(v|vg|verges?)\b/g, "$1 ");
  t = t.replace(/[-',.!?;:]/g, " ").replace(/\s+/g, " ").trim();
  var words = t.split(" "), out = [], cur = null, prev = null;
  function flush(){ if(cur!==null){ out.push(String(cur)); cur = null; } }
  for(var i=0;i<words.length;i++){
    var w = words[i];
    if(/^\d+$/.test(w)){
      // « 1 50 » → 150 n'arrive presque jamais ; un nombre en chiffres est pris tel quel
      flush(); out.push(w); prev = w; continue;
    }
    if(w === "et" && cur!==null && i+1<words.length && NUM_WORDS[words[i+1]]!==undefined){ prev = w; continue; }
    if(NUM_WORDS[w]!==undefined){
      var v = NUM_WORDS[w];
      if(cur===null) cur = 0;
      if(v === 100){ cur = (cur===0 ? 1 : cur) * 100; }
      else if(v === 20 && prev === "quatre"){ cur = cur - 4 + 80; }
      else cur += v;
      prev = w; continue;
    }
    flush(); out.push(w); prev = w;
  }
  flush();
  return out;
}

// Transforme une phrase en liste de commandes : {type, value}
function parseVoice(txt){
  var tk = normalizeVoice(txt), cmds = [];
  // Une longue phrase est une discussion, pas une commande : elle va au journal comme note
  // (sauf « note ... » explicite). Les vraies commandes sont courtes : « fer 7 fairway reste 150 ».
  if(tk.length > 8 && tk[0] !== "note") return cmds;
  var isNum = function(x){ return x!==undefined && /^\d+$/.test(x); };
  var FER = /^(fer|faire|fair|ferre|fers|ferres)$/;
  for(var i=0;i<tk.length;i++){
    var w = tk[i], n1 = tk[i+1], n2 = tk[i+2];
    // note vocale libre : tout le reste de la phrase
    if(w === "note"){ var rest = tk.slice(i+1).join(" "); if(rest) cmds.push({type:"note", value:rest}); break; }
    // terrain / départ
    if(w === "cacouna" || w === "kakouna" || w === "cacona"){ cmds.push({type:"course", value:"Golf Cacouna"}); continue; }
    if(w === "matane" || w === "matanne" || w === "matâne"){ cmds.push({type:"course", value:"Golf Matane"}); continue; }
    if(w === "bleu" || w === "bleus" || w === "bleue" || w === "bleues"){ cmds.push({type:"tee", value:"bleu"}); continue; }
    if(w === "riviere" || w === "rivière" || w === "loup"){ cmds.push({type:"course", value:"Golf Rivière-du-Loup"}); if(n1==="du" && n2==="loup") i+=2; continue; }
    if(w === "neigette" || w === "negette" || (w === "val" && (n1||"").indexOf("nei")===0)){ cmds.push({type:"course", value:"Val-Neigette"}); if(w==="val") i++; continue; }
    if(w === "blanc" || w === "blancs" || w === "blanche" || w === "blanches"){ cmds.push({type:"tee", value:"blanc"}); continue; }
    if(w === "rouge" || w === "rouges"){ cmds.push({type:"tee", value:"rouge"}); continue; }
    if((w === "c" && n1 === "est" && (n2 === "parti" || n2 === "partie")) ){ cmds.push({type:"go"}); i+=2; continue; }
    if(w === "parti" || w === "partie" || w === "go" || w === "commence" || w === "commencer" || w === "demarre"){ cmds.push({type:"go"}); continue; }
    // navigation entre les trous
    if(w === "trou"){
      if(n1 === "suivant"){ cmds.push({type:"nexthole"}); i++; continue; }
      if(n1 === "precedent"){ cmds.push({type:"prevhole"}); i++; continue; }
      if(isNum(n1)){ cmds.push({type:"gohole", value:parseInt(n1,10)}); i++; continue; }
      continue;
    }
    // bâtons
    if(w === "driver"){ cmds.push({type:"club", value:"Cobra1"}); continue; }
    // « cobra », « cobra 1 », « cobra un » = le nouveau driver (remplace le Bois 1)
    if(w === "cobra" || w === "cobra1" || w === "cobras" || w === "copra" || w === "kobra"){
      cmds.push({type:"club", value:"Cobra1"});
      if(n1==="1" || n1==="in" || n1==="hein" || n1==="un") i++;
      continue;
    }
    if(w === "bois" || w === "boit" || w === "boire" || w === "boa" || w === "bo"){
      // « bois 1 », « bois numéro 1 », « bois un/hein/in », « bois cinq/saint/sain »
      var k = i+1;
      while(["numero","no","le","#","de"].indexOf(tk[k])>=0) k++;
      var nx = tk[k];
      if(nx==="1" || nx==="in" || nx==="hein" || nx==="1er" || nx==="premier"){ cmds.push({type:"club", value:"Cobra1"}); i = k; continue; }
      if(nx==="5" || nx==="saint" || nx==="sain" || nx==="sein" || nx==="sink" || nx==="seing"){ cmds.push({type:"club", value:"Bois 5"}); i = k; continue; }
      if(w === "bois"){ cmds.push({type:"boisAlone"}); continue; }
      continue;
    }
    if(w === "hybride" || w === "hybrid" || w === "hybrides"){ cmds.push({type:"club", value:"Hybride 3"}); if(n1==="3") i++; continue; }
    if(FER.test(w) && isNum(n1) && ["5","7","8","9"].indexOf(n1)>=0){ cmds.push({type:"club", value:"Fer "+n1}); i++; continue; }
    if(w === "pitching" || w === "pw" || w === "pitch" || (w === "p" && n1 === "w")){ cmds.push({type:"club", value:"PW"}); if(w==="p"||n1==="wedge") i++; continue; }
    if(w === "sw" || w === "sand" || w === "wedge" || (w === "s" && n1 === "w")){
      var j = i + ((w==="s")?1:0);
      if(tk[j+1] === "wedge") j++;
      if(tk[j+1] === "56"){ cmds.push({type:"club", value:"SW56"}); i = j+1; continue; }
      cmds.push({type:"club", value:"SW"}); i = j; continue;
    }
    if(w === "putter" || w === "puteur" || w === "putteur" || w === "poteur"){ cmds.push({type:"club", value:"Putter"}); continue; }
    // où est tombée la balle
    if(w === "fairway" || w === "ferway" || w === "farouet" || w === "fairways"){ cmds.push({type:"spot", value:"Fairway"}); continue; }
    if(w === "herbe" || w === "rough" || w === "roff"){ cmds.push({type:"spot", value:"Herbe longue"}); if(n1==="longue"||n1==="haute") i++; continue; }
    if(w === "trappe" || w === "bunker" || w === "fosse"){ cmds.push({type:"spot", value:"Trappe de sable"}); if(n1==="de" && tk[i+2]==="sable") i+=2; continue; }
    if(w === "sable"){ cmds.push({type:"sable"}); continue; } // trappe ou SW selon le moment
    if(w === "eau" || w === "lac" || w === "etang" || w === "riviere" || w === "ruisseau"){ cmds.push({type:"spot", value:"Eau"}); continue; }
    if(w === "boise" || w === "foret" || w === "arbres"){ cmds.push({type:"spot", value:"Boisé"}); continue; }
    if(w === "frise" || w === "frange" || w === "collet" || w === "collier" || w === "frises"){ cmds.push({type:"spot", value:"Frise du vert"}); continue; }
    if(w === "vert" || w === "green" || w === "greens"){ cmds.push({type:"green"}); continue; }
    // distance
    if((w === "distance" || w === "reste" || w === "restant" || w === "rester" || w === "a") && isNum(n1)){ cmds.push({type:"dist", value:parseInt(n1,10)}); i++; continue; }
    if(isNum(w)){ cmds.push({type:"num", value:parseInt(w,10)}); continue; }
    // roulés / fin du trou
    if(w === "rentre" || w === "rentree" || w === "rentrer" || w === "dedans" || w === "termine" || w === "terminer" || w === "fini"){ cmds.push({type:"holed"}); continue; }
    if(w === "suivant" || w === "suivante" || w === "continue" || w === "continuer"){ cmds.push({type:"step"}); continue; }
    // confirmer / annuler / état
    if(w === "ok" || w === "okay" || w === "confirme" || w === "confirmer" || w === "valide"){ cmds.push({type:"ok"}); continue; }
    if(w === "annule" || w === "annuler" || w === "efface" || w === "effacer" || w === "oups" || w === "erreur"){ cmds.push({type:"undo"}); continue; }
    if(w === "repete" || w === "repeter" || w === "statut" || (w === "ou" && n1 === "j")){ cmds.push({type:"status"}); continue; }
  }
  return cmds;
}

// Confirme le coup en cours avec la distance affichée (GPS ou dite). Retourne un message.
function voiceConfirmPending(){
  if(!UI.locked) return { ok:true };
  if(UI.digits === ""){
    return { err:"Il me manque la distance du coup au "+UI.locked+". Dis reste, puis le nombre de verges" };
  }
  UI.awaitingSpot = false;
  var club = UI.locked, d = UI.digits, spot = UI.spotForShot;
  App.confirmShotFromSpotScreen();
  var hd = getHole(ROUND.cur);
  var last = hd.shots[hd.shots.length-1];
  var txt = club+" confirmé, "+(last ? (last.before-last.after)+" verges" : "")+(spot ? ", "+spotPlaceLabel(spot) : "");
  if(hd.onGreen) txt += ", tu es sur le vert";
  else txt += ", il reste "+d+(last && last.origFeet!=null ? " pieds" : " verges");
  return { ok:true, say:txt };
}

function runVoiceCommand(c){
  var hd = getHole(ROUND.cur);
  // --- avant le départ ---
  if(!ROUND.setupConfirmed){
    if(c.type === "course"){ ROUND.course = c.value; ROUND.holes = {}; saveRound(); return { say:c.value }; }
    if(c.type === "tee"){ ROUND.tee = c.value; ROUND.holes = {}; saveRound(); return { say:"Départ des "+c.value+"s" }; }
    if(c.type === "go" || c.type === "ok"){
      if(!ROUND.course || !ROUND.tee) return { err:"Il me faut le terrain et le départ d'abord" };
      App.confirmSetup(true);
      hd = getHole(ROUND.cur);
      return { say:"C'est parti ! Trou "+ROUND.cur+", par "+hd.par+", "+hd.startDist+" verges" };
    }
    if(c.type === "status") return { say:Voice.statusPhrase() };
    return { err:"Dis d'abord ton terrain et ton départ, puis c'est parti" };
  }
  switch(c.type){
    case "course": case "tee": return { err:"Pour changer de terrain ou de départ, touche « changer » à l'écran" };
    case "go": return {};
    case "status": return { say:Voice.statusPhrase() };
    case "note":
      if(!hd.shots.length) return { err:"Aucun coup sur ce trou pour y attacher une note" };
      var s = hd.shots[hd.shots.length-1];
      s.note = s.note ? s.note+" · "+c.value : c.value;
      saveRound(); render();
      return { say:"Note ajoutée" };
    case "club":
      if(hd.onGreen) return { err:"Tu es déjà sur le vert — dis la distance en pieds de ton roulé" };
      var r = voiceConfirmPending();
      if(r.err) return r;
      hd = getHole(ROUND.cur);
      if(hd.onGreen) return { say:(r.say||"")+". "+c.value+" ignoré" };
      App.pickClub(c.value);
      App.lockShot();
      return { say:(r.say ? r.say+". " : "")+c.value };
    case "step":
      // Passer à l'étape suivante, peu importe ce qui a été compris avant
      if(hd.onGreen) return runVoiceCommand({ type:"holed" });
      if(!UI.locked){
        App.pickClub("À préciser");
        App.lockShot();
        return { say:"Coup noté, bâton à préciser plus tard" };
      }
      if(UI.awaitingSpot){
        UI.awaitingSpot = false; UI.spotForShot = null; render();
        updateSuggestion();
        return { say:"Position sautée" };
      }
      return voiceConfirmPending();
    case "boisAlone":
      // « bois » tout seul : le boisé si un coup est en cours, sinon le bâton
      if(UI.locked) return runVoiceCommand({ type:"spot", value:"Boisé" });
      if(hd.shots.length === 0) return runVoiceCommand({ type:"club", value:"Cobra1" });
      return { err:"Cobra ou bois 5 ?" };
    case "sable":
      if(UI.locked) return runVoiceCommand({ type:"spot", value:"Trappe de sable" });
      return runVoiceCommand({ type:"club", value:"SW" });
    case "spot":
      if(!UI.locked) return { err:"Dis d'abord le bâton que tu viens de frapper" };
      if(UI.awaitingSpot){ App.chooseSpot(c.value); }
      else { UI.spotForShot = c.value; render(); }
      return { say:c.value === "Frise du vert" ? "Frise. Dis reste et la distance en pieds du trou" : c.value, noPrompt:c.value === "Frise du vert" };
    case "green":
      if(hd.onGreen) return { say:"Déjà sur le vert" };
      if(!UI.locked) return { err:"Dis d'abord le bâton du coup qui t'a amené sur le vert" };
      var club = UI.locked;
      App.confirmShot(0);
      return { say:club+" confirmé. Bravo" };
    case "dist":
    case "num":
      if(hd.onGreen){
        var t = puttTargetIndex(hd);
        hd.putts[t] = c.value; UI.puttTarget = null; UI.digits = ""; UI.touched = false;
        saveRound(); render();
        return { say:(t===0 ? "Premier roulé à " : "Il reste ")+c.value+" pieds" };
      }
      if(UI.locked){
        UI.digits = String(c.value); UI.touched = true; UI.gpsFilled = false;
        if(UI.awaitingSpot){ UI.awaitingSpot = false; }
        render();
        return { say:"Reste "+c.value+(UI.spotForShot==="Frise du vert" ? " pieds" : " verges") };
      }
      if(hd.shots.length === 0 && c.type === "dist"){
        hd.startDist = c.value; saveRound(); render();
        return { say:"Distance du trou corrigée à "+c.value+" verges" };
      }
      return { err:"Dis d'abord le bâton que tu vas frapper" };
    case "ok":
      if(UI.locked) return voiceConfirmPending();
      if(hd.onGreen) return { say:"Dis rentré quand la balle est dans le trou" };
      return {};
    case "holed":
      if(!hd.onGreen) return { err:"Tu n'es pas encore sur le vert" };
      var done = ROUND.cur;
      App.registerPutts();
      var nh = getHole(ROUND.cur);
      if(ROUND.cur === done) return { say:"Trou "+done+" terminé. C'était le dernier trou, bravo" };
      return { say:"Trou "+done+" terminé. Trou "+ROUND.cur+", par "+nh.par+", "+nh.startDist+" verges" };
    case "nexthole":
      if(hd.onGreen) return runVoiceCommand({ type:"holed" });
      if(ROUND.cur >= 18) return { err:"C'est déjà le dernier trou" };
      App.goHole(ROUND.cur+1);
      var h2 = getHole(ROUND.cur);
      return { say:"Trou "+ROUND.cur+", par "+h2.par+", "+h2.startDist+" verges" };
    case "prevhole":
      if(ROUND.cur <= 1) return { err:"Tu es au premier trou" };
      App.goHole(ROUND.cur-1);
      return { say:"Retour au trou "+ROUND.cur };
    case "gohole":
      if(c.value < 1 || c.value > 18) return { err:"Trou "+c.value+" inexistant" };
      App.goHole(c.value);
      var h3 = getHole(ROUND.cur);
      if(h3.onGreen) return { say:"Trou "+ROUND.cur+", tu étais sur le vert" };
      return { say:"Trou "+ROUND.cur+", par "+h3.par+", "+beforeDist(h3)+" verges" };
    case "undo":
      App.undoLastShot();
      return { say:"Dernier coup annulé" };
  }
  return {};
}

document.addEventListener("visibilitychange", function(){
  if(!document.hidden && isVoiceMode()){
    Voice.keepScreenOn();
    if(Voice.handsFree && !Voice.listening) Voice.restartSoon();
  }
});

document.addEventListener("fullscreenchange", render);
document.addEventListener("webkitfullscreenchange", render);

render();
checkForUpdate();
if(LIC && !isGpsOnDemand()) startGPSWatch();
</script>
